<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="index, follow">
<title>TaerStudio — iOS apps</title>
<meta name="description" content="TaerStudio builds focused iOS apps.">
<link rel="icon" href="/assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/invoicemaker-icon.png">
<style>
  :root {
    --bg: #ffffff; --surface: #f6f7f9; --text: #1c1e21; --muted: #5f6570;
    --heading: #0b0c0e; --border: #e4e7ec; --link: #2563eb;
    --max: 820px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417; --surface: #1a1d21; --text: #d6d9de; --muted: #9aa1ac;
      --heading: #f2f4f7; --border: #2a2e34; --link: #7cb0ff;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 17px; line-height: 1.65; padding: 0 20px 64px;
  }
  .wrap { max-width: var(--max); margin: 0 auto; }
  header {
    border-bottom: 1px solid var(--border); margin: 0 -20px 72px; padding: 14px 20px;
  }
  .header-inner {
    max-width: var(--max); margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .brand { font-weight: 700; color: var(--heading); font-size: 15px; letter-spacing: .2px; }
  .header-nav { display: flex; gap: 18px; font-size: 14px; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }

  h1 { color: var(--heading); font-size: 2.1rem; line-height: 1.15; margin: 0 0 .2em; letter-spacing: -.02em; }
  .lead { font-size: 1.1rem; color: var(--muted); margin: 0 0 48px; }

  .app {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 22px;
    display: flex; gap: 18px; align-items: center;
  }
  .app img { width: 72px; height: 72px; flex: 0 0 72px; border-radius: 16px; display: block; }
  .app h2 { margin: 0; font-size: 1.1rem; color: var(--heading); }
  .app p { margin: 2px 0 8px; font-size: 15px; color: var(--muted); }
  .app-links { display: flex; flex-wrap: wrap; gap: 16px; font-size: 14px; }

  @media (max-width: 520px) {
    .app { flex-direction: column; align-items: flex-start; gap: 14px; }
  }

  footer {
    margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--border);
    color: var(--muted); font-size: 14px;
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">TaerStudio</div>
    <nav class="header-nav">
      <a href="/support.html">Support</a>
      <a href="mailto:dev.tahatosun@gmail.com">Contact</a>
    </nav>
  </div>
</header>

<div class="wrap">
  <h1>TaerStudio</h1>
  <p class="lead">Focused iOS apps that keep your data on your device.</p>

  <div class="app">
    <img src="/assets/invoicemaker-icon.png" alt="InvoiceMaker app icon" width="72" height="72">
    <div>
      <h2>InvoiceMaker</h2>
      <p>Invoices and estimates, sent as PDFs, tracked to the last payment.</p>
      <div class="app-links">
        <a href="/support.html#invoicemaker">Support</a>
        <a href="/invoicemaker/privacy-policy.html">Privacy Policy</a>
      </div>
    </div>
  </div>

  <footer>© 2026 TaerStudio · <a href="mailto:dev.tahatosun@gmail.com">dev.tahatosun@gmail.com</a></footer>
</div>
</body>
</html>
